[package]
name = "qomune-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = "=3.9.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
argon2 = "0.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
